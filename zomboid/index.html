<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Sobrevivente Zomboid</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
<style>html,body{margin:0;height:100%;background:#111;color:#eee;font-family:-apple-system,sans-serif}
h1{position:absolute;top:0;left:0;right:0;margin:0;padding:12px;text-align:center;font-size:20px;z-index:2}
model-viewer{width:100%;height:100%;background:#111;--poster-color:#111}
#st{position:absolute;bottom:20px;width:100%;text-align:center;z-index:2}</style></head>
<body><h1>Sobrevivente Zomboid</h1>
<model-viewer id="mv" alt="Sobrevivente Zomboid" camera-controls touch-action="pan-y" auto-rotate shadow-intensity="1" exposure="1" ar ar-modes="webxr scene-viewer quick-look"></model-viewer>
<div id="st">Carregando modelo...</div>
<script>
(async()=>{try{
const n=8,ps=[];for(let i=0;i<n;i++)ps.push(fetch('part0'+i).then(r=>{if(!r.ok)throw r.status;return r.text()}));
const b64=(await Promise.all(ps)).join('').replace(/\s/g,'');
const bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
const url=URL.createObjectURL(new Blob([u],{type:'model/gltf-binary'}));
const mv=document.getElementById('mv');mv.src=url;
mv.addEventListener('load',()=>document.getElementById('st').textContent='');
}catch(e){document.getElementById('st').textContent='Erro ao carregar: '+e}})();
</script></body></html>
